name: Deploy to Namecheap

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy application via rsync
        env:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.PORT }}
        run: |
          echo "$key" > /tmp/private_key
          chmod 600 /tmp/private_key
          rsync -avz -e "ssh -i /tmp/private_key -o StrictHostKeyChecking=no -p $port" \
            --exclude='.env' --exclude='node_modules' --exclude='storage' ./ \
            $username@$host:/home/$username/craftprofessor.amowogbaje.com

      - name: Run post-deploy commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.PORT }}
          script: |
            cd /home/${{ vars.USERNAME }}/craftprofessor.amowogbaje.com
            # composer install --no-dev --optimize-autoloader --no-scripts
            php artisan migrate --force
            # php artisan optimize:clear
            # php artisan optimize
            # chmod -R 777 storage bootstrap/cache
