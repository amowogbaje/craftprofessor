
# CraftProfessor — local Docker setup
#
# Quick start:
#   1. cp backend/.env.example backend/.env   (skip if you already have one)
#   2. Fill in whatever AI provider keys you actually want to test
#      (GEMINI_API_KEY at minimum) in backend/.env — DB_*/QUEUE_CONNECTION
#      below are overridden automatically for the container network, so
#      don't worry about those.
#   3. docker compose up --build
#   4. Backend:  http://localhost:8000
#      Frontend: http://localhost:5173
#      MySQL:    localhost:3306 (user/pass below, handy for a GUI client)
#
# First boot installs composer + npm dependencies and runs migrations
# automatically (see backend/docker/entrypoint.sh) — this can take a
# couple of minutes the first time, then starts instantly after that.
#
# Everything here is tunable via a root-level `.env` file (docker compose
# loads one automatically if present) — e.g. add MYSQL_PASSWORD=... to
# override the default below.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-craftprofessor}
      MYSQL_USER: ${MYSQL_USER:-craftprofessor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-craftprofessor}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    environment: &backend_env
      # Points the app at the containerized MySQL/queue regardless of
      # whatever DB_HOST/QUEUE_CONNECTION your backend/.env has for
      # non-Docker local dev — env vars here win over the .env file.
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-craftprofessor}
      DB_USERNAME: ${MYSQL_USER:-craftprofessor}
      DB_PASSWORD: ${MYSQL_PASSWORD:-craftprofessor}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      FILESYSTEM_DISK: public
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    volumes:
      - ./backend:/var/www/html
      # Named volumes so the bind mount above doesn't shadow (or get
      # shadowed by) what composer installs inside the container —
      # otherwise an empty host ./backend/vendor would hide the installed
      # one, or vice versa depending on mount order.
      - backend_vendor:/var/www/html/vendor
      - backend_storage_framework:/var/www/html/storage/framework

  # Runs AssembleStoryVideoJob (ffmpeg) and GenerateVideoJob (Veo/Agnes) —
  # same image as `backend`, same setup, just a different long-running
  # command. Split into its own container so a slow video assembly job
  # doesn't block the web process.
  queue:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=900']
    environment: *backend_env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage_framework:/var/www/html/storage/framework

  # Scheduler — runs the story:generate-images / story:generate-image-prompts
  # / story:generate-narration-audio commands every minute, same as cron
  # would in production (see README's deploy workflow for the production
  # equivalent). Comment this out if you'd rather trigger those commands
  # manually with `docker compose exec backend php artisan story:...`.
  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command: ['sh', '-c', 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done']
    environment: *backend_env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage_framework:/var/www/html/storage/framework

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data:
  backend_vendor:
  backend_storage_framework:
  frontend_node_modules:
